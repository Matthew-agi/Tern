name: CPU contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install pytest httpx pyyaml build
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m tern plan --profile rtx-pro-6000
