[build-system]
requires = ["setuptools>=80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "tern-serving"
version = "0.1.0"
description = "Tern typed decisions with a frozen vLLM joint-head runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [] # Install the platform-specific requirements.lock first.

[project.scripts]
tern = "tern.__main__:main"

[project.entry-points."vllm.general_plugins"]
tern_pooler = "kev_vllm:register"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["serve_clef_api"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tern = ["configs/*.json", "configs/tuning/*/*.json"]
kev_vllm = ["stateless_sources.json", "CLEF_LICENSE"]
